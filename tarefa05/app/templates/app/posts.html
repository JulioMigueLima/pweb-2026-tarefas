{% extends 'app/base.html' %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}

    <h2>{{ post.titulo }}</h2>
    <h4>Postado em: {{ post.data_publicacao|date:"d/m/Y" }}</h4>

    {% if post.imagem %}
        <img src="{{ post.imagem.url }}" alt="{{ post.titulo }}">
    {% endif %}

    <p>{{ post.texto|safe }}</p>
{% endblock %}
