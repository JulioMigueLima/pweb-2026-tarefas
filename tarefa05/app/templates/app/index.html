{% extends 'app/base.html' %}

{% block content %}
    <h2>Últimas Postagens</h2>
    {% for post in posts %}
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 800px; margin: 0 auto; padding: 20px;"></div>
        <article>
            <h3><a href="{% url 'posts' post.id %}">{{ post.titulo }}</a></h3>
            <p>Publicado em: {{ post.data_publicacao|date:"d/m/Y" }}</p>
        </article>
        <hr>
    {% endfor %}
{% endblock %}
